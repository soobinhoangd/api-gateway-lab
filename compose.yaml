services:
  gateway:
    build: .
    ports: ["127.0.0.1:8088:8088"]
    environment:
      GATEWAY_HOST: 0.0.0.0
      USER_SERVICE_URL: http://user:3001
      ORDER_SERVICE_URL: http://order:3002
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-this-secret-123456789}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-avatars}
    depends_on:
      user: {condition: service_started}
      order: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
  user:
    build: .
    command: ["node", "src/user.js"]
    environment: {SERVICE_HOST: 0.0.0.0}
    ports: ["127.0.0.1:3001:3001"]
  order:
    build: .
    command: ["node", "src/order.js"]
    environment: {SERVICE_HOST: 0.0.0.0}
    ports: ["127.0.0.1:3002:3002"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8088,http://127.0.0.1:8088
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-avatars}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        attempts=0
        until mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" && mc ready local; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
volumes:
  minio-data:
